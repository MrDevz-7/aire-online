# Docker Compose para el entorno de DESARROLLO LOCAL de AirE_Online.
#
# Levanta TRES servicios, encadenados por healthchecks:
#   postgres (healthy) -> engine (healthy) -> gateway
#
# El engine (FastAPI) y el gateway (Express) también se pueden correr
# fuera de Docker durante el desarrollo (con venv y npm respectivamente),
# pero en M7 el flujo oficial es levantarlos con Compose para verificar
# el contrato de punta a punta.
#
# Vive en la raíz del monorepo porque la infraestructura es compartida
# del proyecto, no un detalle interno de /engine ni de /gateway.
#
# Variables de entorno (M8):
#   - Cada servicio lee SU PROPIO .env: `engine/.env` y `gateway/.env`.
#     Son archivos locales, NO versionados (git los ignora).
#   - `INTERNAL_API_TOKEN` (D79) DEBE tener el MISMO valor en los dos:
#     el gateway lo manda, el engine lo exige. Si difieren, todo
#     `/internal/*` responde 401.
#   - NO hace falta un .env en la raíz del repo. Compose no lo usa.
#
# Uso (desde la raíz del repo):
#   docker compose up -d --build     # construye y levanta todo
#   docker compose ps                # estado (los 3 deben decir "healthy")
#   docker compose logs -f engine    # logs en vivo de un servicio
#   docker compose down              # apaga (los datos de Postgres quedan)
#   NUNCA usar `down -v` salvo que quieras borrar la base a propósito.
#
# Migraciones: se corren aparte, una sola vez (o cuando cambien):
#   docker compose run --rm engine alembic upgrade head
#
# Lección M7: `docker compose restart` NO recarga env_file. Si cambiás
# una variable en `.env`, usá:
#   docker compose up -d --force-recreate <servicio>
name: aire_online

services:
  postgres:
    # Misma versión mayor que usa Supabase por defecto (Postgres 17).
    # No subir a una mayor más nueva que la de Supabase.
    image: postgres:17
    container_name: aire_online_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aire_online
      # Contraseña de DESARROLLO LOCAL. Se puede sobreescribir con la
      # variable de entorno POSTGRES_PASSWORD (o un .env en la raíz, que
      # está en .gitignore). Si la cambiás, DATABASE_URL debe coincidir.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aire_online_dev}
      POSTGRES_DB: aire_online
    ports:
      # 127.0.0.1: solo tu propia PC puede conectarse. Sin ese prefijo,
      # Docker publica en 0.0.0.0 y otras máquinas de tu red podrían llegar.
      - "127.0.0.1:5432:5432"
    volumes:
      # Volumen nombrado: los datos viven fuera del contenedor y
      # sobreviven a `docker compose down` y a recrear el contenedor.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aire_online -d aire_online"]
      interval: 5s
      timeout: 5s
      retries: 5

  engine:
    # Build desde la carpeta ./engine. El Dockerfile ya existe (M1/M2):
    # usa la imagen de Playwright como base (M12 decidirá si eso se
    # optimiza; hoy no molesta y el módulo no la usa).
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: aire_online_engine
    restart: unless-stopped
    # env_file lee las variables del .env del engine (que NO se commitea).
    # Ahí viven OPENAQ_API_KEY, AQICN_TOKEN, GEMINI_API_KEYS, y desde M8
    # también INTERNAL_API_TOKEN.
    env_file:
      - ./engine/.env
    environment:
      # Sobrescribe la DATABASE_URL del .env: dentro de Compose, la base
      # no está en localhost, está en el servicio `postgres`. Compose crea
      # un DNS interno donde `postgres` resuelve a la IP del contenedor.
      # La interpolación ${POSTGRES_PASSWORD:-...} usa el mismo default
      # que el servicio postgres, así no se pueden desincronizar.
      DATABASE_URL: postgresql+psycopg2://aire_online:${POSTGRES_PASSWORD:-aire_online_dev}@postgres:5432/aire_online
      # OJO: en producción esto tiene que ser "production" (el engine no
      # arranca sin INTERNAL_API_TOKEN — D79). En Compose de desarrollo
      # queda en "development" para que /internal/* siga abiertas si
      # alguien no configuró el token (flujo manual de D44).
      ENVIRONMENT: development
      # NOTA M8: INTERNAL_API_TOKEN NO va acá. Viene del env_file de
      # arriba (`engine/.env`), junto con el resto de las variables del
      # engine. Declararlo también acá pisaría el del env_file.
    ports:
      # Solo 127.0.0.1: la persona sigue llamando /internal/* directo
      # al engine desde su PC (D44), pero el puerto no queda expuesto a
      # la red local. El gateway lo alcanza por la red interna de Compose
      # (`http://engine:8000`), no por este puerto publicado.
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        # condition: service_healthy espera a que el healthcheck de
        # postgres pase a `healthy`, no solo a que el contenedor arranque.
        # Sin esto, el engine puede intentar conectar antes de que
        # Postgres esté listo para aceptar conexiones.
        condition: service_healthy
    healthcheck:
      # Healthcheck liviano con `python -c`: no requiere curl ni wget
      # en la imagen. Llama a /api/health, que no depende de la base
      # (por diseño: si la base se cae, el engine sigue respondiendo y
      # el gateway puede dar un 503 limpio en vez de un cuelgue).
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      # start_period: le da margen al arranque del engine (imports de
      # FastAPI, SQLAlchemy, etc.) antes de empezar a contar fallos.
      start_period: 20s

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: aire_online_gateway
    restart: unless-stopped
    # M8: el gateway ahora tiene su propio .env (que NO se commitea),
    # con JWT_SECRET, INTERNAL_API_TOKEN, etc. Antes de M8, todas las
    # variables iban inline acá abajo; ahora van al env_file y solo
    # quedan acá los overrides específicos del entorno Compose.
    env_file:
      - ./gateway/.env
    environment:
      # NODE_ENV=production: el Dockerfile del gateway ya lo setea en la
      # etapa de runtime, pero lo repetimos acá para que el compose sea
      # autocontenido y no dependa de leer el Dockerfile.
      NODE_ENV: production
      PORT: 4000
      # Origen del frontend permitido por CORS. Hoy es el Next.js local.
      CORS_ORIGINS: http://localhost:3000
      # URL del engine por la red interna de Compose (nombre de servicio,
      # NO localhost). La usará el cliente HTTP del Bloque 4.
      ENGINE_URL: http://engine:8000
      # Timeout del cliente del engine.
      ENGINE_TIMEOUT_MS: "8000"
      # NOTA M8: JWT_SECRET, INTERNAL_API_TOKEN, REFRESH_TTL_S,
      # JWT_ACCESS_TTL_S, COOKIE_SAMESITE y ADMIN_TIMEOUT_MS vienen del
      # env_file (`gateway/.env`), NO van acá. Si los pusieras acá
      # pisarían los del env_file.
    ports:
      # El gateway SÍ se publica al host sin restricción de IP: es la
      # puerta de entrada pública (el frontend y cualquier consumidor
      # externo hablan con él, no con el engine).
      - "4000:4000"
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      # node -e con fetch (nativo en Node 20+): no requiere curl ni wget,
      # que no están en node:24-alpine por defecto.
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:4000/health')
          .then(r => process.exit(r.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  # Nombre final en Docker: aire_online_pgdata (proyecto + clave).
  pgdata: